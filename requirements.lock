# =====================================================================
# requirements.lock — 再現性のためのバージョン固定（自治体の長期運用向け）
# =====================================================================
# 目的: 5〜10年後や別環境でも「動作確認済みと同じ版」で導入できるようにする。
#   未固定だと将来の `pip install` が非互換な新版を引き、動かなくなる恐れがあるため。
#
# 使い方（動作確認済みの版で入れる）:
#   pip install -r requirements.lock
#
# ここに固定するのはアプリの直接依存（トップレベル）。人が読む説明は requirements.txt を参照。
# ※ 完全な再現（推移的依存も含む）が必要なら、クリーンな仮想環境で
#   `pip freeze > requirements.full.lock` を採取して併用する。
# ※ 監査で確認済みのライセンス（すべて permissive）は requirements.txt のコメント参照。
#   PyMuPDF(AGPL) / pykakasi(GPL) は不使用（除外済み）。
#
# 採取: 動作確認時に導入されていた版（Python 3.12）。
# ---------------------------------------------------------------------

